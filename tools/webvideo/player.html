<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>webvideo player</title>
<!--
  Web-page video player (prototype, docs/video-web.md).
  load(timeline, theme) once, then seek(t) draws the frame for video time t and returns a key:
  the same key means the same pixels, so render.js can reuse the previous screenshot.
  No third-party scripts, no storage APIs (imitator STYLE.md rules), fonts are local system fonts.
  Themes: slide (kept for Shorts), paper (dark editorial / data-journalism), terminal (SQL + CLI with TUI output).
-->
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden;font-family:"Noto Sans CJK TC","Noto Sans TC",sans-serif}
#bg{position:absolute;inset:0;overflow:hidden}
#bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
#bgshade{position:absolute;inset:0}
#bglabel{position:absolute;left:56px;bottom:250px;font-size:22px}
#head{position:absolute;left:72px;right:72px;top:44px;display:flex;justify-content:space-between;align-items:baseline;gap:40px}
#brand{font-weight:700;font-size:30px;white-space:nowrap}
#chapter{font-size:28px;text-align:right}
#card{position:absolute;left:0;right:0}
#card .top,#card .value,#card .label{display:block}
#card img{display:block}
#src{position:absolute;font-size:24px}
#sub{position:absolute;left:120px;right:120px;bottom:70px;text-align:center;font-weight:900;font-size:58px;line-height:1.32}
#sub div{display:block}
#prog{position:absolute;left:0;bottom:0;height:6px;width:100%}
#prog i{position:absolute;left:0;top:0;bottom:0;display:block}
#term{display:none}

/* ---------- theme: slide (make_video.py look; kept for Shorts) ---------- */
.slide{background:#10172a;color:#fff}
.slide #bgshade{background:linear-gradient(180deg,rgba(8,12,24,.72),rgba(8,12,24,.86))}
.slide #bglabel{color:rgba(255,255,255,.7)}
.slide #brand{font-family:"Noto Serif CJK TC",serif;color:#e8ecf6}
.slide #chapter{color:#c3cbe0}
.slide #card{top:250px;text-align:center}
.slide #card .top{font-size:44px;font-weight:700;color:#dfe5f3}
.slide #card .value{margin:22px auto 0;display:inline-block;font-size:110px;font-weight:900;line-height:1.15;color:#fff;background:#d33a2c;padding:10px 40px;border-radius:10px}
.slide #card .label{margin-top:26px;font-size:42px;color:#dfe5f3}
.slide #card img{margin:0 auto;max-width:1500px;max-height:560px;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.slide #src{right:72px;top:820px;color:#9aa6c2}
.slide #sub{color:#fff;text-shadow:0 3px 8px #000,0 0 2px #000}
.slide #prog{background:rgba(255,255,255,.12)}.slide #prog i{background:#d33a2c}

/* ---------- theme: paper, dark (late-night editorial / data-journalism) ---------- */
.paper{background:#111318;color:#ece6da}
.paper #bg{display:none}
.paper #head{top:40px;padding-bottom:18px;border-bottom:2px solid #3a3d45}
.paper #brand{font-family:"Noto Serif CJK TC",serif;font-size:30px;color:#ece6da}
.paper #chapter{font-family:"Noto Serif CJK TC",serif;font-weight:700;color:#e8a05f}
.paper #card{left:160px;right:160px;top:230px;text-align:left}
.paper #card .top{font-size:40px;font-weight:700;color:#9d968a;letter-spacing:.06em}
.paper #card .value{margin-top:14px;font-family:"Noto Serif CJK TC",serif;font-weight:900;font-size:136px;line-height:1.1;color:#f2b36f}
.paper #card .label{margin-top:20px;font-size:44px;color:#ece6da;border-left:10px solid #e8a05f;padding-left:24px}
.paper #card img{max-width:1600px;max-height:520px;background:#fff;padding:20px;border:1px solid #3a3d45}
.paper #src{left:160px;top:760px;color:#8a8478;font-size:26px}
.paper #src::before{content:"資料｜";font-weight:700}
.paper #sub{left:0;right:0;bottom:40px;padding:26px 140px;background:#1c1f26;color:#ece6da;font-size:54px;border-top:1px solid #2c2f37}
.paper #prog{bottom:auto;top:0;height:8px;background:#1f2229}.paper #prog i{background:#e8a05f}

/* ---------- theme: terminal (SQL + CLI, TUI-style output built from the real cards) ---------- */
.terminal{background:#0a0c10;color:#d7dde8}
.terminal #bg,.terminal #card,.terminal #src,.terminal #prog{display:none}
.terminal #brand{font-family:"Noto Sans Mono CJK TC",monospace;color:#7fd1ff}
.terminal #chapter{color:#8a94a8;font-family:"Noto Sans Mono CJK TC",monospace}
.terminal #term{display:block;position:absolute;left:80px;right:80px;top:110px;height:700px;background:#12161e;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.6);overflow:hidden;border:1px solid #232a36}
.terminal #term .bar{height:44px;background:#1b212c;display:flex;align-items:center;gap:12px;padding-left:20px}
.terminal #term .bar i{width:14px;height:14px;border-radius:50%;display:block}
.terminal #term .bar span{margin-left:14px;color:#8a94a8;font:22px "Noto Sans Mono CJK TC",monospace}
.terminal #lines{position:absolute;left:34px;right:34px;top:62px;bottom:62px;overflow:hidden;font:28px/1.5 "Noto Sans Mono CJK TC",monospace;white-space:pre;display:flex;flex-direction:column;justify-content:flex-end}
.terminal #lines>*{flex-shrink:0;min-height:42px}
.terminal .tui{margin:6px 0 4px;border:2px solid #3e5675;border-radius:4px;padding:10px 22px 10px;position:relative;display:inline-grid;grid-template-columns:auto auto;column-gap:36px;row-gap:2px;align-self:flex-start;margin-top:22px}
.terminal .tui .t{position:absolute;left:16px;top:-22px;background:#12161e;padding:0 10px;color:#7fd1ff}
.terminal .tbl{display:inline-grid;grid-template-columns:auto auto 640px;column-gap:28px;align-self:flex-start;border-top:2px solid #3e5675;border-bottom:2px solid #3e5675;padding:4px 10px;margin:4px 0}
.terminal .tbl .h{color:#7fd1ff;border-bottom:1px solid #3e5675}
.terminal .tbl i{display:block;height:24px;margin-top:9px}
.terminal #status{position:absolute;left:0;right:0;bottom:0;height:46px;background:#1f6f8b;color:#e9f6fb;font:24px/46px "Noto Sans Mono CJK TC",monospace;white-space:pre;padding:0 20px;display:flex;justify-content:space-between}
.terminal #status b{background:#e9f6fb;color:#1f6f8b;padding:0 12px;font-weight:700}
.terminal .pr{color:#b9eb5f}.terminal .cmd{color:#e6edf7}.terminal .kw{color:#c792ea;font-weight:700}.terminal .str{color:#ffcb6b}
.terminal .com{color:#6f7b90}.terminal .box{color:#4f6a8a}.terminal .key{color:#7fd1ff}.terminal .val{color:#ffd479;font-weight:700}
.terminal .bar1{color:#f07178}.terminal .bar2{color:#7fd1ff}.terminal .ok{color:#b9eb5f}.terminal .dim{color:#6f7b90}
.terminal .figwrap{display:flex;gap:24px;align-items:flex-start}
.terminal .figwrap img{max-height:330px;max-width:900px;border:2px solid #4f6a8a;background:#fff}
.terminal #cursor{display:inline-block;width:16px;height:32px;background:#d7dde8;vertical-align:-6px}
.terminal #sub{color:#fff;bottom:64px;font-size:54px}

/* ---------- theme: trace (cold open only, via theme "opening"; then paper) ---------- */
.trace{background:#0a0c10;color:#d7dde8}
.trace #bg,.trace #card,.trace #src,.trace #prog,.trace #chapter{display:none}
.trace #brand{font-family:"Noto Sans Mono CJK TC",monospace;color:#7fd1ff}
.trace #term{display:block;position:absolute;left:80px;right:80px;top:110px;height:700px;background:#12161e;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.6);overflow:hidden;border:1px solid #232a36}
.trace #term .bar{height:44px;background:#1b212c;display:flex;align-items:center;gap:12px;padding-left:20px}
.trace #term .bar i{width:14px;height:14px;border-radius:50%;display:block}
.trace #term .bar span{margin-left:14px;color:#8a94a8;font:22px "Noto Sans Mono CJK TC",monospace}
.trace #lines{position:absolute;left:34px;right:34px;top:62px;bottom:62px;overflow:hidden;font:26px/1.5 "Noto Sans Mono CJK TC",monospace;white-space:pre}
.trace .pr{color:#b9eb5f}
.trace #cursor{display:inline-block;width:15px;height:30px;background:#d7dde8;vertical-align:-6px}
.trace .th{display:flex;justify-content:space-between;margin:14px 0 8px;padding:6px 12px;background:#1b2230;color:#9fb0c8;font-size:22px}
.trace .th b{color:#ffd479}
.trace .sp{display:grid;grid-template-columns:420px 250px 780px 1fr;align-items:center;height:38px}
.trace .nm{color:#e6edf7;overflow:hidden;text-overflow:ellipsis}.trace .svc{color:#7f8aa0;font-size:21px;overflow:hidden;text-overflow:ellipsis}
.trace .lane{position:relative;height:22px;border-left:1px solid #2c3442}
.trace .lane i{position:absolute;top:0;height:22px;border-radius:3px;background:#3f8fd6}
.trace .WARN .lane i{background:#d6a33f}.trace .ERROR .lane i{background:#e05b5b}
.trace .dur{color:#7f8aa0;font-size:21px;text-align:right}
.trace .attr{color:#7f8aa0;font-size:21px;padding-left:28px;margin-bottom:6px}.trace .attr b{color:#ffd479}.trace .attr em{color:#ff8080;font-style:normal;font-weight:700}
.trace .logs{position:absolute;left:0;right:0;bottom:0;border-top:1px solid #2c3442;padding-top:6px;font-size:22px}
.trace .lg .tm{color:#6f7b90}.trace .lv{font-weight:700}.trace .lv.INFO{color:#7fd1ff}.trace .lv.WARN{color:#ffcb6b}.trace .lv.ERROR{color:#ff6b6b}.trace .kv{color:#6f7b90}
.trace #status{position:absolute;left:0;right:0;bottom:0;height:46px;background:#7a2730;color:#fbe9ea;font:24px/46px "Noto Sans Mono CJK TC",monospace;white-space:pre;padding:0 20px;display:flex;justify-content:space-between}
.trace #status b{background:#fbe9ea;color:#7a2730;padding:0 12px}
.trace #sub{color:#fff;bottom:64px;font-size:54px}
</style></head>
<body>
<div id="stage">
  <div id="bg"><img id="bgimg" alt=""><div id="bgshade"></div><div id="bglabel"></div></div>
  <div id="head"><span id="brand">● 深夜 Debug</span><span id="chapter"></span></div>
  <div id="card"></div>
  <div id="src"></div>
  <div id="term"><div class="bar"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i><span id="cwd"></span></div><div id="lines"></div><div id="status"></div></div>
  <div id="sub"></div>
  <div id="prog"><i></i></div>
</div>
<script>
let D = null, THEME = 'slide', LOOK = 'slide', prev = {}, BLOCKS = [], OPEN_END = 0;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lastAt(list, t, key) { let r = -1; for (let i = 0; i < list.length; i++) { if (list[i][key] <= t) r = i; else break; } return r; }
function sourceText(s) { return s === 'report' ? D.report_label : s; }
const mmss = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

// ---------- terminal: turn each real card into a command and a TUI answer ----------
// Commands and layout are staged (the "mock" half); every value, label and source shown is the card's own (the "real" half).
const W = s => { let n = 0; for (const ch of String(s)) n += ch.codePointAt(0) > 0x2e80 ? 2 : 1; return n; };
const pad = (s, n) => s + ' '.repeat(Math.max(0, n - W(s)));
const seg = (text, cls) => ({ text, cls });
const nums = s => (String(s).match(/\d[\d,]*(?:\.\d+)?/g) || []).map(x => parseFloat(x.replace(/,/g, '')));
const slug = () => D.episode.replace(/^ep\d+-/, '');
const QUOTE = s => `'${s}'`;
const EP = () => D.episode.split('-')[0];
const PROMPT = () => `ping@debugafterdark:~/${EP()}$ `;

// box-drawing glyphs are full-width in CJK mono fonts, so frames and tables are drawn with CSS borders instead
const boxLines = (title, rows) => [{ box: { title, rows } }];

function blockFor(c, i) {
  const src = sourceText(c.source);
  if (c.kind === 'figure') {
    return { prompt: PROMPT(), cmd: [seg('trace plot ', 'cmd'), seg('fig01', 'str'), seg(' --from report.html', 'cmd')],
      out: [{ fig: c.image, caption: c.label }, [seg('-- ' + src, 'com')]] };
  }
  const v = nums(c.value);
  if (c.value.includes('→') && v.length >= 2) { // a before/after pair: SQL with bars
    const [a, b] = c.label.includes('→') ? c.label.split('→').map(s => s.trim()) : ['之前', '之後'];
    const parts = c.value.split('→').map(s => s.trim());
    const max = Math.max(v[0], v[1]) || 1;
    return { prompt: 'report=> ', cmd: [seg('SELECT ', 'kw'), seg('period, value ', 'cmd'), seg('FROM ', 'kw'), seg('findings ', 'cmd'), seg('WHERE ', 'kw'), seg('topic = ', 'cmd'), seg(QUOTE(c.top), 'str'), seg(';', 'cmd')],
      out: [{ table: [[a, parts[0], v[0] / max, 'bar2'], [b, parts[1], v[1] / max, 'bar1']] }, [seg('(2 rows)  -- ' + src, 'com')]] };
  }
  if (v.length && i % 2 === 0) { // a number: SQL, one row
    const rows = [['value', c.value, 'val']]; if (c.label) rows.push(['note', c.label]);
    return { prompt: 'report=> ', cmd: [seg('SELECT ', 'kw'), seg('value, note ', 'cmd'), seg('FROM ', 'kw'), seg('findings ', 'cmd'), seg('WHERE ', 'kw'), seg('topic = ', 'cmd'), seg(QUOTE(c.top), 'str'), seg(';', 'cmd')],
      out: [...boxLines(c.top, rows), [seg('(1 row)  -- ' + src, 'com')]] };
  }
  // anything else: the episode's own CLI
  const rows = [['finding', c.value, 'val']]; if (c.label) rows.push(['context', c.label]); rows.push(['source', src]);
  return { prompt: PROMPT(), cmd: [seg('trace grep ', 'cmd'), seg(`"${c.top}"`, 'str'), seg(' --source report.html', 'cmd')],
    out: [[seg('✓ ', 'ok'), seg('found in report.html', 'dim')], ...boxLines(c.top, rows)] };
}

function lineHtml(l) {
  if (l.box) return `<div class="tui"><span class="t">${esc(l.box.title)}</span>${l.box.rows.map(([k, v, cls]) => `<span class="dim">${esc(k)}</span><span class="${cls || 'cmd'}">${esc(v)}</span>`).join('')}</div>`;
  if (l.table) return `<div class="tbl"><span class="h">period</span><span class="h">value</span><span class="h"></span>${l.table.map(([p, v, f, cls]) => `<span>${esc(p)}</span><span class="val">${esc(v)}</span><span><i style="width:${Math.max(2, Math.round(f * 100))}%;background:${cls === 'bar1' ? '#f07178' : '#7fd1ff'}"></i></span>`).join('')}</div>`;
  if (l.fig) return `<div class="figwrap"><img src="${l.fig}" alt=""><span class="ok">▸ ${esc(l.caption)}</span></div>`;
  return `<div>${l.map(s => s.cls ? `<span class="${s.cls}">${esc(s.text)}</span>` : esc(s.text)).join('')}</div>`;
}

window.load = function (data, theme) {
  D = data; THEME = theme || 'slide';
  LOOK = THEME === 'opening' ? 'trace' : THEME;
  $('stage').className = LOOK;
  OPEN_END = D.chapters.length > 1 ? D.chapters[1].t : D.duration;
  $('cwd').textContent = `ping@debugafterdark: ~/${D.episode}`;
  prev = {};
  if (THEME === 'terminal' || THEME === 'opening') {
    // typing starts early so the answer lands on the anchor sentence, but never before the previous answer
    const CPS = 32, THINK = 0.35;
    BLOCKS = D.cards.map((c, i) => {
      const b = blockFor(c, i), len = b.cmd.reduce((n, s) => n + s.text.length, 0);
      const want = c.t - len / CPS - THINK, floor = i ? D.cards[i - 1].t + 0.6 : 0;
      return Object.assign(b, { start: Math.max(want, floor), len, cps: CPS, think: THINK, t: c.t });
    });
  }
  return Promise.all(D.backgrounds.map(b => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = b.src; })));
};

function set(id, prop, val) { // touch the DOM only when something changed
  const k = id + '.' + prop; if (prev[k] === val) return; prev[k] = val;
  const el = $(id);
  if (prop === 'html') el.innerHTML = val; else if (prop === 'className') el.className = val; else if (prop === 'src') el.src = val; else el.style[prop] = val;
}

function terminalFrame(t, ci, key) {
  const chStart = ci >= 0 ? D.chapters[ci].t : 0;
  let html = '';
  const lines = [];
  if (ci >= 0) lines.push([seg(`-- 第 ${ci + 1} 章：${D.chapters[ci].name}`, 'com')]);
  let state = 'idle', typed = 0, lastPrompt = PROMPT();
  BLOCKS.forEach((b, i) => {
    if (b.start > t || D.cards[i].t < chStart - 0.01) return; // this chapter's cards only: a new chapter clears the screen
    lastPrompt = b.prompt;
    const n = Math.min(b.len, Math.floor((t - b.start) * b.cps));
    // command, cut to n characters
    let left = n; const cmd = [];
    for (const s of b.cmd) { if (left <= 0) break; cmd.push(seg(s.text.slice(0, left), s.cls)); left -= s.text.length; }
    const typing = n < b.len, waiting = !typing && t < b.start + b.len / b.cps + b.think;
    lines.push({ prompt: b.prompt, cmd, cursor: typing });
    if (typing) { state = 'typing'; typed = n; return; }
    if (waiting) { lines.push([seg('⠋ 查詢中…', 'dim')]); state = 'wait'; return; }
    for (const l of b.out) lines.push(l);
    lines.push([]);
    state = 'done';
  });
  const blink = Math.floor(t * 2) % 2;
  if (state !== 'typing') lines.push({ prompt: lastPrompt, cmd: [], cursor: true });
  for (const l of lines) {
    if (l && l.prompt !== undefined) html += `<div><span class="pr">${esc(l.prompt)}</span>${l.cmd.map(s => s.cls ? `<span class="${s.cls}">${esc(s.text)}</span>` : esc(s.text)).join('')}${l.cursor ? `<span id="cursor" style="opacity:${l.cursor && state === 'typing' ? 1 : blink ? 0 : 1}"></span>` : ''}</div>`;
    else html += lineHtml(l);
  }
  set('lines', 'html', html);
  const k = lastAt(D.cards, t, 't'), c = k >= 0 ? D.cards[k] : null;
  const bars = Math.round(20 * Math.min(1, t / D.duration));
  set('status', 'html', `<span><b>${esc(D.episode.split('-')[0])}</b> 1:report 2:sql*  第 ${ci + 1}/${D.chapters.length} 章</span><span>${'▮'.repeat(bars)}${'▯'.repeat(20 - bars)} ${mmss(t)} / ${mmss(D.duration)}  src: ${esc(c ? sourceText(c.source) : '—')}</span>`);
  key.push(state, typed, state === 'typing' ? 0 : blink, bars, Math.floor(t), k);
}


// ---------- trace: the cold open as an observability trace (spans + logs), used by theme "opening" ----------
function traceId() { let h = 2166136261; for (const ch of D.episode) h = Math.imul(h ^ ch.codePointAt(0), 16777619); return (h >>> 0).toString(16).padStart(8, '0'); }
const ts = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${(s % 60).toFixed(1).padStart(4, '0')}`;
function traceFrame(t, key) {
  const cards = D.cards.filter(c => c.t < OPEN_END && c.kind !== 'figure');
  const span = OPEN_END, AREA = 760;
  const live = cards.filter(c => c.t <= t);
  // the first card the report itself makes is the suspect: that is where the episode's question lives
  const suspect = cards.findIndex(c => c.source === D.report_label || c.source === 'report');
  const level = i => i === suspect ? 'ERROR' : i === 0 ? 'INFO' : 'WARN';
  const cmd = `trace tail --episode ${EP()} --follow`;
  const n = Math.min(cmd.length, Math.floor(t * 40));
  let rows = '';
  cards.forEach((c, i) => {
    if (c.t > t) return;
    const end = i + 1 < cards.length ? cards[i + 1].t : span;
    const x = Math.round(AREA * c.t / span), w = Math.max(6, Math.round(AREA * (Math.min(t, end) - c.t) / span / 4) * 4);
    const lv = level(i), open = t < end;
    rows += `<div class="sp ${lv}"><span class="nm">${i === 0 ? '' : '└ '}${esc(c.top)}</span><span class="svc">${esc(sourceText(c.source))}</span>` +
      `<span class="lane"><i style="left:${x}px;width:${w}px"></i></span><span class="dur">${open ? '…' : (end - c.t).toFixed(1) + 's'}</span></div>` +
      `<div class="attr">value=<b>"${esc(c.value)}"</b>${c.label ? `  note="${esc(c.label)}"` : ''}${i === suspect ? '  <em>◀ root cause?</em>' : ''}</div>`;
  });
  const logs = live.slice(-4).map((c, j, a) => { const i = cards.indexOf(c); return `<div class="lg"><span class="tm">${ts(c.t)}</span> <span class="lv ${level(i)}">${level(i).padEnd(5)}</span> <span class="msg">${esc(c.top)}：${esc(c.value)}</span> <span class="kv">src=${esc(sourceText(c.source))}</span></div>`; }).join('');
  const blink = Math.floor(t * 2) % 2;
  const html = `<div class="cmdl"><span class="pr">${esc(PROMPT())}</span>${esc(cmd.slice(0, n))}${n < cmd.length ? '<span id="cursor"></span>' : ''}</div>` +
    (n >= cmd.length ? `<div class="th"><span>TRACE <b>${traceId()}</b></span><span>${esc(D.chapters[0] ? D.chapters[0].name : '')}</span><span>spans ${live.length}/${cards.length}　${ts(t)}</span></div>` +
      `<div class="spans">${rows}</div><div class="logs">${logs}</div>` : '');
  set('lines', 'html', html);
  set('status', 'html', `<span><b>${esc(EP())}</b> 1:trace* 2:report  cold open</span><span>${blink ? '●' : '○'} live  ${ts(t)}</span>`);
  key.push(n, live.length, live.length ? Math.round(AREA * (Math.min(t, (cards[live.length] || {t: span}).t) - live[live.length - 1].t) / span / 4) : 0, blink, Math.floor(t * 10) / 10);
}

window.seek = function (t) {
  const key = [];
  if (THEME === 'opening') { LOOK = t < OPEN_END ? 'trace' : 'paper'; set('stage', 'className', LOOK); key.push(LOOK); }
  // set() on className: handled below
  const ci = lastAt(D.chapters, t, 't');
  const chap = ci >= 0 ? D.chapters[ci].name : '';
  set('chapter', 'html', esc(LOOK === 'terminal' || LOOK === 'trace' ? '' : (LOOK === 'paper' ? `第 ${ci + 1} 章　${chap}` : chap)));
  key.push(ci);

  let cue = null; for (const c of D.cues) { if (c.t0 <= t && t < c.t1) { cue = c; break; } if (c.t0 > t) break; }
  set('sub', 'html', cue ? cue.lines.map(l => `<div>${esc(l)}</div>`).join('') : '');
  key.push(cue ? cue.t0 : -1);

  if (LOOK === 'terminal') { terminalFrame(t, ci, key); return JSON.stringify(key); }
  if (LOOK === 'trace') { traceFrame(t, key); return JSON.stringify(key); }

  // background with a slow 4% push-in per segment (slide theme only), quantized to ~1px steps
  const bi = lastAt(D.backgrounds, t, 't');
  if (LOOK === 'slide' && bi >= 0) {
    const b = D.backgrounds[bi], next = D.backgrounds[bi + 1], end = next ? next.t : D.duration;
    const p = Math.min(1, (t - b.t) / Math.max(1, end - b.t));
    const sc = Math.round((1 + 0.04 * p) * 2000) / 2000;
    set('bgimg', 'src', b.src); set('bgimg', 'transform', `scale(${sc})`);
    set('bglabel', 'html', esc(b.label || ''));
    key.push(bi, sc);
  }

  // card: the latest one, fading in over 0.4 s and rising 12 px
  const k = lastAt(D.cards, t, 't');
  const c = k >= 0 ? D.cards[k] : null;
  const f = Math.round(Math.min(1, (c ? t - c.t : 99) / 0.4) * 12) / 12;
  let html = '';
  if (c && c.kind === 'figure') html = `<img src="${c.image}" alt=""><span class="label">${esc(c.label)}</span>`;
  else if (c) html = `<span class="top">${esc(c.top)}</span><span class="value">${esc(c.value)}</span><span class="label">${esc(c.label)}</span>`;
  set('card', 'html', html);
  set('card', 'opacity', String(f));
  set('card', 'transform', `translateY(${Math.round((1 - f) * 12)}px)`);
  set('src', 'html', c ? esc(sourceText(c.source)) : '');
  set('src', 'opacity', String(f));
  key.push(k, f);

  const w = Math.round(1920 * Math.min(1, t / D.duration) / 2) * 2;
  set('prog', 'html', `<i style="width:${w}px"></i>`);
  key.push(w);
  return JSON.stringify(key);
};
</script>
</body></html>
