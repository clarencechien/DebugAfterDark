<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=LXGW+WenKai+TC:wght@700&display=block">
<style>
/* Link-preview card (1200x630), rendered by tools/make_og.py with Playwright; same banner and type as the site header. */
html,body{margin:0;width:1200px;height:630px;background:#0b0e1a;overflow:hidden}
.card{position:relative;width:1200px;height:630px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 72px 76px;box-sizing:border-box;
  background:linear-gradient(90deg,#0b0e1a 0,rgba(11,14,26,.88) 32%,rgba(11,14,26,.25) 66%,rgba(11,14,26,0) 100%),
             linear-gradient(0deg,#0b0e1a 0,rgba(11,14,26,0) 40%),#0b0e1a url(../art/banner-v2-0-2400.jpg) 70% center/cover no-repeat}
h1{margin:0;font:700 112px/1.05 "LXGW WenKai TC",serif;color:#ebe7dc}
p{margin:14px 0 0;font:500 26px/1.5 "IBM Plex Mono",monospace;color:#9ba1ba}
.status{display:inline-flex;align-items:center;gap:12px;margin-top:26px;padding:8px 16px;border:1px solid #242b46;border-radius:999px;
  background:rgba(18,23,41,.7);font:500 22px/1.4 "IBM Plex Mono",monospace;color:#ebe7dc;align-self:flex-start}
.dot{width:12px;height:12px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 5px rgba(229,72,77,.18)}
</style></head>
<body><div class="card"><h1>深夜 Debug</h1><p>Debug After Dark · 主持人 Ping</p><span class="status"><span class="dot"></span>每集一個 breakpoint</span></div></body></html>
