# 把 podcast 網站（feed.xml、封面、音檔、收聽頁）發佈到 GitHub Pages。
#
# 什麼會上架：episodes/*/episode.json 裡 "status": "final" 而且有 "published" 的集數。
# 網站由 tools/build_site.py 組出來（只用 Python 標準函式庫，runner 內建 Python，不 pip install），
# 它會先核對每個 mp3 跟 episode.json 的 bytes／sha256 一致，不一致就失敗、不部署。
#
# 觸發：push 到 main（episodes/、show/、組站工具有變動時）、每天定時一次，或在 Actions 頁手動 Run workflow。
# 排程上架：episode.json 的 "published" 還沒到的集數，merge 之後也不會出現（tools/feed.py 的 final_episodes），
# 等到 "published" 之後的下一次建置才上架。所以一集可以提早 merge，"published" 填上架時間，
# 每天的定時建置會把它放出來。cron 是 UTC；GitHub 的排程可能晚幾分鐘到半小時，"published" 要早於 cron 的時間。
#
# 安全：
# - 不用 pull_request_target，fork 來的 PR 碰不到部署權限。
# - 只用 GitHub 官方的 actions，全部釘在 commit SHA（tag 是可變的）。升版時自己查：
#     git ls-remote https://github.com/actions/checkout refs/tags/v4.4.0
name: Publish podcast site

on:
  push:
    branches: [main]
    paths:
      - 'episodes/**'
      - 'show/**'
      - 'tools/feed.py'
      - 'tools/build_site.py'
      - 'tools/legal_pages.py'
      - '.github/workflows/pages.yml'
  schedule:
    # 每天兩次：08:07 和 20:07（台北）。上架時間在實驗中（早上或晚上），選哪個只要把 "published" 填在
    # 那次之前（例如 08:00 或 20:00），不用改這裡。
    - cron: '7 0 * * *'    # 08:07 台北
    - cron: '7 12 * * *'   # 20:07 台北
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 一次只部署一個，不要中途取消正在進行的部署。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build site
        run: python3 tools/build_site.py --out site
      - name: Check the feed parses
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('site/feed.xml'); print('feed.xml ok')"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
