<title>深夜 Debug 工廠</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面：手機直式一欄，寬螢幕兩欄；上面四格數字，下面依「多常變」排區塊 */
:root{
  --bg:#f5f5f1;--card:#fff;--ink:#1d1d1b;--ink2:#55544f;--ink3:#7c7b75;--line:#e4e2dc;
  --accent:#2f5fd0;--good:#1f7a4d;--good-bg:#e5f3ea;--warn:#8a5200;--warn-bg:#fbf0dc;--bad:#b3261e;--bad-bg:#fbe6e4;
  --chip:#efeee9;--bar:#2f5fd0;--bar-bg:#e8e7e1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--ink2:#b5b3ac;--ink3:#86847d;--line:#33322f;
  --accent:#8fb0ff;--good:#6fd09a;--good-bg:#1c3326;--warn:#f0b65a;--warn-bg:#3a2d16;--bad:#ff8a80;--bad-bg:#3d1f1c;
  --chip:#2a2a27;--bar:#8fb0ff;--bar-bg:#2e2e2b;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--ink2:#b5b3ac;--ink3:#86847d;--line:#33322f;
  --accent:#8fb0ff;--good:#6fd09a;--good-bg:#1c3326;--warn:#f0b65a;--warn-bg:#3a2d16;--bad:#ff8a80;--bad-bg:#3d1f1c;
  --chip:#2a2a27;--bar:#8fb0ff;--bar-bg:#2e2e2b;color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:960px;margin:0 auto;padding-block:12px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header{display:flex;align-items:center;gap:8px;padding:8px 0 12px}
h1{font-size:20px;margin:0;flex:1}
h2{font-size:16px;margin:0}
h3{font-size:13px;margin:14px 0 6px;color:var(--ink2);font-weight:600}
a{color:var(--accent);text-decoration:none}
button{font:inherit;min-height:36px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.muted{color:var(--ink3);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile .k{font-size:12px;color:var(--ink2)}
.tile .v{font-size:22px;font-weight:650;line-height:1.25;margin-top:2px;overflow-wrap:anywhere}
.tile .n{font-size:12px;color:var(--ink3);margin-top:2px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.sh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sh .muted{margin-left:auto}
.cols{display:grid;gap:12px}
@media(min-width:900px){.cols{grid-template-columns:1fr 1fr}.cols section{margin-bottom:0}}
ul.rows{list-style:none;margin:0;padding:0}
ul.rows>li{padding:8px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
ul.rows>li:first-child{border-top:0}
.when{flex:0 0 74px;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px;padding-top:1px}
.body{flex:1;min-width:0}
.t{overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.ep{font-weight:650;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:12px;line-height:1.4;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--ink2);margin:2px 4px 0 0;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.day{font-size:12px;font-weight:600;color:var(--ink3);margin:10px 0 0;letter-spacing:.02em}
.day.today{color:var(--accent)}
.meter{height:8px;background:var(--bar-bg);border-radius:4px;overflow:hidden;margin:6px 0 2px}
.meter>i{display:block;height:100%;background:var(--bar);border-radius:4px}
.meter.warn>i{background:var(--warn)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--accent);font-size:14px}
.stale{color:var(--warn)}
.empty{color:var(--ink3);font-size:14px;padding:6px 0}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--ink2);font-weight:600;border-top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opens{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opens button{font-size:13px;padding:4px 10px;min-height:32px;color:var(--accent)}
.flow{list-style:none;margin:4px 0 6px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px}
.flow li{position:relative}
.flow a{display:flex;flex-direction:column;height:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink)}
.flow li.hot a{border-color:var(--warn);background:var(--warn-bg)}
.flow .n{font-size:22px;font-weight:650;line-height:1.2;font-variant-numeric:tabular-nums}
.flow .l{font-size:13px;color:var(--ink2)}
.flow .h{font-size:11px;color:var(--ink3)}
section.next{border-color:var(--accent)}
.dots{display:inline-flex;gap:3px;margin:0 6px 0 2px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--bar-bg);border:1px solid var(--line)}
.dots i.on{background:var(--good);border-color:var(--good)}
a.btn{display:inline-flex;align-items:center;font-size:13px;padding:4px 10px;min-height:32px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
#viewer{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#viewer .vh{display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));border-bottom:1px solid var(--line);background:var(--card)}
#viewer .vh h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer .vb{flex:1;overflow:auto;padding-block:12px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#viewer .md{max-width:760px;margin:0 auto;line-height:1.75}
#viewer .md h1{font-size:20px}#viewer .md h2{font-size:18px;margin-top:20px}#viewer .md h3{font-size:16px;color:var(--ink)}
#viewer .md table{display:block;overflow-x:auto}
#viewer .md blockquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--line);color:var(--ink2)}
#viewer .md code{background:var(--chip);padding:0 4px;border-radius:4px;font-size:.92em}
#viewer iframe{flex:1;width:100%;min-height:0;border:0;background:#fff;display:block}
#viewer .vb.frame{padding:0;display:flex;flex-direction:column;overflow:hidden}
#viewer[hidden]{display:none}
#vaudio{display:block;width:100%;padding:6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));background:var(--card);border-bottom:1px solid var(--line)}
#vaudio[hidden]{display:none}
</style>
<main>
<header><h1>深夜 Debug 工廠</h1><span class="muted" id="loaded"></span><button id="reload" type="button">重新整理</button></header>
<div id="app"><p class="muted">讀取中…</p></div>
<div id="viewer" hidden><div class="vh"><h2 id="vtitle"></h2><button type="button" id="vdl">存到裝置</button><button type="button" id="vclose">關閉</button></div><audio id="vaudio" controls preload="metadata" hidden></audio><div class="vb" id="vbody"></div></div>
</main>
<script>

(function(){
"use strict";
var TZ = "Asia/Taipei";
var app = document.getElementById("app");
function esc(s){return String(s == null ? "" : s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function safeUrl(u){return /^https:\/\//.test(u||"") ? esc(u) : "#";}
function link(text,url){return '<a href="'+safeUrl(url)+'" target="_blank" rel="noopener">'+esc(text)+'</a>';}
function chip(text,kind){return '<span class="chip'+(kind?" "+kind:"")+'">'+esc(text)+'</span>';}
var fmtDay = new Intl.DateTimeFormat("zh-TW",{timeZone:TZ,month:"numeric",day:"numeric",weekday:"short"});
var fmtTime = new Intl.DateTimeFormat("zh-TW",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false});
var fmtKey = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"});
function dayKey(d){return fmtKey.format(d);}
function ago(iso){
  if(!iso) return "沒有資料";
  var m = Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(m < 1) return "剛剛";
  if(m < 60) return m+" 分鐘前";
  var h = Math.round(m/60); if(h < 48) return h+" 小時前";
  return Math.round(h/24)+" 天前";
}
function fresh(sec,maxHours){
  var iso = sec && (sec.generated || sec._pushed);
  var old = !iso || (Date.now()-new Date(iso).getTime()) > maxHours*3600000;
  return '<span class="muted'+(old?" stale":"")+'">'+(old?"⚠ ":"")+"更新於 "+esc(ago(iso))+'</span>';
}
function stepChip(label,v){
  v = String(v||"");
  var kind = v.indexOf("✅")>=0 ? "good" : v.indexOf("🔶")>=0 || v.indexOf("⏰")>=0 ? "warn" : "";
  var mark = v.indexOf("✅")>=0 ? "✓ " : v.indexOf("🔶")>=0 ? "… " : v.indexOf("⏰")>=0 ? "⏰ " : "○ ";
  return chip(mark+label,kind);
}
function sectionHead(title,sec,maxHours,extra){return '<div class="sh"><h2>'+esc(title)+'</h2>'+(extra||"")+fresh(sec,maxHours)+'</div>';}
function tile(k,v,n){return '<div class="tile"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div><div class="n">'+(n||"")+'</div></div>';}

// 重畫時保留畫面：哪些區塊展開著、捲到哪裡。資料沒變就不重畫。
var lastSig = null, lastLoad = 0;
function detailsKey(el){
  var sec = el.closest("section"), h = sec && sec.querySelector("h2");
  var sum = el.querySelector("summary");
  return (h ? h.textContent : "") + "|" + (sum ? sum.textContent.replace(/[0-9０-９]+/g,"#") : "");
}
var CACHE_KEY = "factory-dashboard-last";
function render(d, cached){
  var sig = JSON.stringify(d);
  if(!cached){ try { localStorage.setItem(CACHE_KEY, JSON.stringify({at: Date.now(), d: d})); } catch(e) {} }
  if(sig === lastSig){ document.getElementById("loaded").textContent = fmtTime.format(new Date())+" 載入（沒變）"; return; }
  lastSig = sig;
  function keys(){ var seen = {}; return Array.prototype.map.call(app.querySelectorAll("details"),function(el){ var k = detailsKey(el); seen[k] = (seen[k]||0)+1; return [k+"#"+seen[k], el]; }); }
  var state = {}, y = window.scrollY;
  keys().forEach(function(x){ state[x[0]] = x[1].open; });
  _render(d);
  keys().forEach(function(x){ if(x[0] in state) x[1].open = state[x[0]]; });
  window.scrollTo(0, y);
  if(cached) document.getElementById("loaded").textContent = "先顯示 "+fmtTime.format(new Date(cached))+" 的資料，更新中…";
}
// 打開時先畫上次存在這台裝置上的資料，讀完專案檔案再換成最新的（讀檔要一個一個來，要等十幾秒）
function showCached(){
  try {
    var c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if(c && c.d && !lastSig) render(c.d, c.at);
  } catch(e) {}
}
var REPORT_URL = "https://claude.ai/artifact/TiWp48ojRAq9K5QRUZk1uJ";   // 成效報表（每週一更新，獨立的成品）
var DAY = 86400000;
function epName(n){ return typeof n === "number" ? "EP"+(n<10?"0":"")+n : String(n||""); }
function openBtn(p, title, label, mp3){ return '<button type="button" class="open" data-path="'+esc(p)+'" data-title="'+esc(title)+'"'+(mp3 ? ' data-mp3="'+esc(mp3)+'"' : "")+'>'+esc(label)+'</button>'; }
// 一條線：上面一排步驟（數字），下面每一步一個可展開的清單；點步驟就展開那一格
function flow(id, steps){
  var bar = '<ol class="flow">'+steps.map(function(s,i){
    return '<li class="'+(s.hot ? "hot" : "")+'"><a href="#'+id+'-'+i+'" data-step="'+id+'-'+i+'"><span class="n">'+esc(s.count)+'</span><span class="l">'+esc(s.label)+'</span>'+(s.hint ? '<span class="h">'+esc(s.hint)+'</span>' : "")+'</a></li>';
  }).join("")+'</ol>';
  var lists = steps.map(function(s,i){
    return '<details id="'+id+'-'+i+'"'+(s.open ? " open" : "")+'><summary>'+esc(s.label)+'（'+esc(s.count)+'）</summary>'+(s.body || '<p class="empty">沒有。</p>')+'</details>';
  }).join("");
  return bar + lists;
}
function rowsOf(items, fn){ return items.length ? '<ul class="rows">'+items.map(fn).join("")+'</ul>' : '<p class="empty">沒有。</p>'; }

function _render(d){
  var repo = d.repo, rs = d.research, tr = d.traffic, now = Date.now(), html = "";
  var eps = (repo && repo.episodes) || [], next = (repo && repo.next) || [], shorts = d.shorts || [];
  var pubT = function(e){ return e.published ? new Date(e.published).getTime() : null; };

  // ── 研究：每題走到哪一步 ──
  var qinfo = {};
  if(rs){ (rs.questions||[]).concat(rs.remakes||[]).forEach(function(x){ qinfo[x.id] = x; }); }
  var remakeFile = {}; ((rs && rs.remakes) || []).forEach(function(x){ if(x.file) remakeFile[x.id] = x.file; });
  var runs = ((rs && rs.runs) || []).map(function(it){ if(/^R/.test(it.id) && !it.files.draft && remakeFile[it.id]){ it.files.draft = remakeFile[it.id]; if(it.stages.indexOf("draft") < 0) it.stages.unshift("draft"); } return it; });
  var stOf = function(id){ return (qinfo[id] && qinfo[id].status) || ""; };
  var qText = function(id, it){ return (qinfo[id] && qinfo[id].q) || (it && it.title) || id; };
  // 報告的狀態機（題庫「狀態」欄開頭的詞，research/questions.md 第 5 行）：
  //   候選 → 排隊（・優先 N）→ 研究中 → 等你看 → 已上線；不收的不顯示
  // 狀態欄沒照這六個詞寫的舊列，用研究產出檔推：有報告＝等你看，有初稿＝研究中，都沒有＝排隊
  var runById = {}; runs.forEach(function(it){ runById[it.id] = it; });
  var RSTATES = ["候選","排隊","研究中","等你看","已上線","不收"];
  var rstate = function(x){
    var st = (x.status||"").trim(), hit = RSTATES.filter(function(w){ return st.indexOf(w) === 0; })[0];
    if(hit) return hit;
    if(/^待研究/.test(st)) return "排隊";
    if(/Clarence 審過|已上線/.test(st)) return "已上線";
    var it = runById[x.id]; if(!it) return "排隊";
    return (it.stages||[]).indexOf("report") >= 0 ? "等你看" : "研究中";
  };
  var allQ = ((rs && rs.questions) || []).concat((rs && rs.remakes) || []);
  var byState = {}; RSTATES.forEach(function(w){ byState[w] = []; });
  allQ.forEach(function(x){ x.rstate = rstate(x); byState[x.rstate].push(x); });
  var prio = function(x){ var m = /優先\s*(\d+)/.exec(x.status||""); return m ? Number(m[1]) : 999; };
  var queued = byState["排隊"].sort(function(a,b){ return prio(a) - prio(b); });
  var lastAt = function(x){ var it = runById[x.id]; return it ? it.at : 0; };
  var toReview = byState["等你看"].sort(function(a,b){ return lastAt(a) - lastAt(b); });   // 最早做好的先審
  var inMill = byState["研究中"], doneR = byState["已上線"].sort(function(a,b){ return lastAt(b) - lastAt(a); });
  var pending = ((rs && rs.candidates) || []).filter(function(x){ return !/不收|已收/.test(x.status||""); });

  // ── Podcast：每集在哪一格 ──
  // Podcast 線的狀態機：每集的 stage 由 tools/factory_status.py 從檔案算（製作中 → 等試聽 → 已排程 → 已上線 → 成效）
  // 上線時間一到就在畫面上翻成「已上線」，不等 GitHub 每 4 小時重算
  var stg = function(e){ var t = pubT(e);
    if(t && t <= now) return now - t < 7*DAY ? "已上線" : "成效";
    if(e.stage) return e.stage;
    return e.status === "final" ? "已排程" : e.audio ? "等試聽" : "製作中"; };
  // 試聽過、PR 已開但還沒合併：PR 標題或分支有這集的編號
  var openPrs = (repo && repo.prs) || [];
  var prOf = function(e){ var n = String(e.ep||"").replace(/\D/g,"").replace(/^0+/,""); if(!n) return null;
    var re = new RegExp("ep0*"+n+"(?!\\d)", "i");
    return openPrs.filter(function(x){ return re.test(x.title||"") || re.test(x.branch||""); })[0] || null; };
  var making = eps.filter(function(e){ return stg(e) === "製作中"; });
  var listening = eps.filter(function(e){ return stg(e) === "等試聽" && !prOf(e); });
  var merging = eps.filter(function(e){ return stg(e) === "等試聽" && prOf(e); });
  var queuedEp = eps.filter(function(e){ var t = pubT(e); return t && t > now; });
  var upcoming = queuedEp.concat(shorts.filter(function(s){ return pubT(s) > now; })).sort(function(a,b){ return pubT(a) - pubT(b); });
  var fresh7 = eps.filter(function(e){ var t = pubT(e); return t && t <= now && now - t < 7*DAY; })
                  .concat(shorts.filter(function(s){ var t = pubT(s); return t <= now && now - t < 7*DAY; }))
                  .sort(function(a,b){ return pubT(b) - pubT(a); });
  var results = (tr && !tr.error ? (tr.episodes||[]) : []).filter(function(e){ return e.first7 != null; })
                  .sort(function(a,b){ return (b.ep||0) - (a.ep||0); });

  // ── 1. 你下一步 ──
  var todo = [];
  merging.forEach(function(e){ var pr = prOf(e);
    todo.push({k: "合併", t: e.ep+" "+e.title, s: "試聽過了，PR #"+pr.n+" 合併後就排程上架", url: pr.url, tag: "podcast"}); });
  if(listening.length){
    var l0 = listening[0];
    todo.push({k: "接著試聽", t: l0.ep+" "+l0.title, s: "音檔做好了，等你試聽定稿"+(listening.length > 1 ? "；還有 "+listening.slice(1).map(function(e){return e.ep;}).join("、") : ""),
               open: l0.reviewFile ? [l0.reviewFile, l0.ep+" 試聽稿", "打開試聽稿", l0.mp3] : null, tag: "podcast"});
  } else if(making.length){
    var m0 = making[0];
    todo.push({k: "接著做", t: m0.ep+" "+m0.title, s: "製作中，還沒上架", tag: "podcast"});
  } else if(next.length){
    var n0 = next[0];
    todo.push({k: "接著做", t: (n0.ep ? n0.ep+" " : "推薦 #"+n0.n+" ")+n0.angle, s: (n0.report ? n0.report.text : "")+(n0.time ? "；約 "+n0.time : ""), url: n0.report && n0.report.url, tag: "podcast"});
  }
  if(toReview.length){
    var r0 = toReview[0], f0 = (runById[r0.id] || {}).files || {}, of = f0.report || f0.draft || (r0.file || null);
    todo.push({k: "接著審", t: r0.id+" "+r0.q, s: (f0.report ? "報告做好了，等你看" : "研究稿做好了，等你看")+(toReview.length > 1 ? "；後面還有 "+(toReview.length-1)+" 份" : ""),
               open: of ? [of, r0.id+(f0.report ? " 報告" : " 研究稿"), f0.report ? "打開報告" : "打開研究稿"] : null, tag: "研究"});
  }
  if(pending.length) todo.push({k: "點頭", t: pending.length+" 個候選題等你決定收不收", s: pending.slice(0,2).map(function(x){return x.q;}).join("；"), jump: "rline-0", tag: "研究"});
  // 成效報表的建議動作（每週一 yt_report 寫進 summary.json）：「資料」類只是說明，不算要你動手的事

// ── 讀專案資料夾 ──
// repo：factory/repo.json（tools/factory_status.py 寫）；研究、流量：直接讀原始檔，打開就是最新的。
var files = null, base = null;
var dec = new TextDecoder();
function plainMd(s){return String(s||"").replace(/\[([^\]]+)\]\([^)]+\)/g,"$1").replace(/<br\s*\/?>/g,"；").replace(/[`*]/g,"").trim();}
function cells(line){return line.trim().replace(/^\||\|$/g,"").split("|").map(function(c){return c.trim();});}
function isSep(c){return c.every(function(x){return /^:?-+:?$/.test(x);});}
function path(rel){return base + rel;}
// 專案檔案一次只發一個請求；被限流（rate_limited）就等 retryAfterMs 再試，最多 6 次
var queue = Promise.resolve();
function call(fn){
  var p = queue.then(function(){
    var tries = 0;
    function go(){
      return fn().catch(function(e){
        if(e && e.code === "rate_limited" && tries++ < 6){
          var wait = Math.max(500, e.retryAfterMs || 0) * (tries > 3 ? 2 : 1);
          return new Promise(function(ok){setTimeout(ok, wait);}).then(go);
        }
        throw e;
      });
    }
    return go();
  });
  queue = p.catch(function(){});
  return p;
}
function readText(rel){return call(function(){return files.read(path(rel));}).then(function(r){return dec.decode(r.bytes);});}
function readJson(rel){return readText(rel).then(function(t){return JSON.parse(t);});}
function listAll(rel, recursive){
  var out = [];
  function page(cursor){
    var o = {path: path(rel), recursive: !!recursive}; if(cursor) o.cursor = cursor;
    return call(function(){return files.list(o);}).then(function(r){out = out.concat(r.entries); return r.cursor ? page(r.cursor) : out;});
  }
  return page();
}
function findBase(){
  // 專案檔案的路徑寫法由平台決定（可能有前綴），從最上層找 research 資料夾推出前綴
  return call(function(){return files.list({});}).then(function(r){
    var hit = r.entries.filter(function(e){return e.isDirectory && /(^|\/)(research|factory)\/?$/.test(e.path);})[0];
    base = hit ? hit.path.replace(/(research|factory)\/?$/,"") : "";
  });
}
function firstTable(md, headRe){
  var lines = md.split("\n"), i = 0;
  if(headRe){ while(i < lines.length && !headRe.test(lines[i])) i++; }
  while(i < lines.length && lines[i].indexOf("|") !== 0) i++;
  var rows = [];
  while(i < lines.length && lines[i].indexOf("|") === 0){ var c = cells(lines[i]); if(!isSep(c)) rows.push(c); i++; }
  return rows.slice(1);
}
function isoWeek(d){
  var t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  var y = t.getUTCFullYear(), w = Math.ceil(((t - Date.UTC(y,0,1)) / 86400000 + 1) / 7);
  return y + "-W" + (w < 10 ? "0" : "") + w;
}

function loadResearch(){
  var res = {questions: [], candidates: [], remakes: [], remakeFiles: {}, ledger: [], runs: [], cost: {total: 0, budget: 100, cap: 90, weeks: {}, months: {}, last: null}, generated: null};
  var newest = 0;
  // 題庫格式還在調：每張表用自己的表頭對欄位（問題、類別、狀態、加入日），對不到就退回位置；編號 Qnn 是正式題、Cnnn 是候選
  var q = readText("research/questions.md").then(function(md){
    var group = "", head = null;
    md.split("\n").forEach(function(line){
      var h = line.match(/^##\s+(.+)/); if(h){ group = h[1].trim(); head = null; return; }
      if(line.indexOf("|") !== 0){ return; }
      var c = cells(line); if(isSep(c)) return;
      var id = plainMd(c[0]);
      if(!/^[QCR]\d+$/i.test(id)){ head = c.map(plainMd); return; }
      var col = function(names, fallback){
        if(head) for(var k = 0; k < head.length; k++) if(names.some(function(n){return head[k].indexOf(n) >= 0;})) return plainMd(c[k] || "");
        return fallback == null ? "" : plainMd(c[fallback] || "");
      };
      if(/^對帳簿/.test(group)){ if(c.length >= 5) res.ledger.push({from: id, what: col(["要對"],1), value: col(["當時"],2), due: col(["對帳日"],3), status: col(["狀態"],4)}); return; }
      if(/^R/i.test(id)){
        var raw = c.join(" "), lm = raw.match(/\]\((?:\.\.\/)?(remake\/research\/[^)\s]+\.md)\)/);
        res.remakes.push({id: id.toUpperCase(), q: col(["問題"],1), group: col(["類別"],2), status: col(["狀態"], c.length-1), file: lm ? path(lm[1]) : null});
        return;
      }
      var isCand = /^C/i.test(id) || /候選/.test(group);
      var rawSt = ""; if(head) for(var k2 = 0; k2 < head.length; k2++) if(head[k2].indexOf("狀態") >= 0) rawSt = c[k2] || "";
      if(!head && !isCand) rawSt = c[c.length-1] || "";
      var lk = rawSt.match(/\((https:\/\/imitator\.ai-apps\.work\/[^)\s]+)\)/);
      var item = {id: id.toUpperCase(), q: col(["問題"],1), group: isCand ? col(["類別"], null) || group : group,
                  status: isCand ? "候選" : col(["狀態"], c.length-1), added: col(["加入日"], null), url: lk ? lk[1] : null};
      (isCand ? res.candidates : res.questions).push(item);
    });
  });
  // 冷飯研究稿的編號跟重製清單的 # 不同，用開頭「重製自」裡的報告 slug 對回清單
  // 題庫已經有冷飯 R 列（研究稿連結在題庫裡）就不用再一份份讀冷飯稿；只有舊版題庫沒有 R 列時才讀
  var remake = q.then(function(){ return res.remakes.length ? [] : listAll("remake/research"); }).then(function(ents){
    var mds = ents.filter(function(e){ return !e.isDirectory && /\/\d+-[^\/]*\.md$/.test("/"+e.path); });
    return Promise.all(mds.map(function(e){
      return call(function(){return files.read(e.path, {length: 3000});}).then(function(r){
        var head = dec.decode(r.bytes), m, re = /\/r\/([\w-]+)/g;
        while((m = re.exec(head))) if(!res.remakeFiles[m[1]]) res.remakeFiles[m[1]] = e.path;
      }).catch(function(){});
    }));
  }).catch(function(){});
  // 研究產出：research/runs 底下所有資料夾（週資料夾、每日資料夾都收），依題號分組，最新的排前面；scout 是找題紀錄，不算
  var runs = listAll("research/runs", true).then(function(all){
    var items = {}, summaries = [];
    function item(id){ return items[id] || (items[id] = {id: id, title: id, verdict: "", answer: "", stages: [], files: {}, at: 0}); }
    all.forEach(function(e){
      if(e.isDirectory || /\/scout\//.test("/"+e.path)) return;
      var name = e.path.split("/").pop(), t = e.createdAt ? new Date(e.createdAt).getTime() : 0;
      if(/00-summary\.md$/.test(name)){ summaries.push(e.path); return; }
      var m = name.match(/^([QR]\d+)/i); if(!m) return;
      newest = Math.max(newest, t);
      // 報告：QNN-report.html、-report-v2.html、-report-final-*.html 都算（raw 不算）；同一階段取最新的檔；補資料紀錄 gaps 不算初稿
      var st = (/report[\w-]*\.html$/.test(name) && !/\.raw\./.test(name)) ? "report" : /review/.test(name) && /\.md$/.test(name) && !/prompt/.test(name) ? "review" : (/\.md$/.test(name) && !/twtone|prompt|gaps/.test(name)) ? "draft" : null;
      var it = item(m[1].toUpperCase()); it.at = Math.max(it.at, t); it._t = it._t || {};
      var better = st && (!(st in it._t) || t > it._t[st] || (t === it._t[st] && /final/.test(name)));
      if(st && it.stages.indexOf(st) < 0) it.stages.push(st); if(better){ it.files[st] = e.path; it._t[st] = t; }
    });
    return Promise.all(summaries.map(function(sp){
      return call(function(){return files.read(sp);}).then(function(r){
        firstTable(dec.decode(r.bytes)).forEach(function(c){
          var m = c[0].match(/[QR]\d+/i); if(!m || !items[m[0].toUpperCase()]) return;
          var it = items[m[0].toUpperCase()]; it.title = plainMd(c[0]); it.verdict = plainMd(c[1]||""); it.answer = plainMd(c[2]||"");
        });
      }).catch(function(){});
    })).then(function(){
      res.runs = Object.keys(items).map(function(k){return items[k];}).sort(function(a,b){return b.at - a.at;});
    });
  });
  var cost = readText("research/runs/cost.log").then(function(t){
    t.split("\n").forEach(function(line){
      if(!line.trim()) return;
      var e; try{ e = JSON.parse(line); }catch(_){ return; }
      var usd = Number(e.usd) || 0, d = new Date(e.time), wk = isoWeek(new Date(d.getTime() + 8*3600000));
      res.cost.total += usd;
      var mk = new Date(d.getTime() + 8*3600000).toISOString().slice(0,7);
      res.cost.months[mk] = Math.round(((res.cost.months[mk] || 0) + usd) * 100) / 100;
      res.cost.weeks[wk] = Math.round(((res.cost.weeks[wk] || 0) + usd) * 100) / 100;
      res.cost.last = {time: e.time, kind: e.kind, target: e.target, usd: Math.round(usd*100)/100};
      newest = Math.max(newest, d.getTime());
    });
    res.cost.total = Math.round(res.cost.total * 100) / 100;
  }).catch(function(){});
  return Promise.all([q, runs, cost, remake]).then(function(){
    res.generated = newest ? new Date(newest).toISOString() : new Date().toISOString();
    return res;
  });
}

// Shorts：shorts/epNN/epNN-short.md 的上架清單寫了排定時間（「排定時間：**11/22（日） 20:00**」）和推薦標題
function loadShorts(){
  return listAll("shorts", true).then(function(es){
    var mds = es.filter(function(e){return !e.isDirectory && /(^|\/)ep\d+-short\.md$/.test(e.path);});
    var out = [], now = new Date();
    var yr = Number(new Intl.DateTimeFormat("en",{timeZone:TZ,year:"numeric"}).format(now)), nowM = Number(new Intl.DateTimeFormat("en",{timeZone:TZ,month:"numeric"}).format(now));
    var pad = function(n){return (Number(n) < 10 ? "0" : "")+Number(n);};
    return mds.reduce(function(p, e){
      return p.then(function(){ return call(function(){return files.read(e.path);}).then(function(r){
        var md = dec.decode(r.bytes), num = e.path.match(/ep(\d+)-short\.md$/)[1];
        var m = md.match(/排定時間[^\n]*?(\d{1,2})\/(\d{1,2})[^\n]*?(\d{1,2}):(\d{2})/); if(!m) return;
        var mm = Number(m[1]), y = yr;
        if(nowM === 12 && mm === 1) y++; else if(nowM === 1 && mm === 12) y--;
        var t = md.match(/^1\.\s+\*\*(.+?)\*\*/m) || md.match(/^#\s+(.+)/m);
        out.push({ep: "EP"+num, title: t ? t[1] : "", published: y+"-"+pad(mm)+"-"+pad(m[2])+"T"+pad(m[3])+":"+m[4]+":00+08:00", isShort: true});
      }).catch(function(err){ console.warn(err); }); });
    }, Promise.resolve()).then(function(){ return out; });
  });
}
function loadTraffic(){
  return readJson("yt-report/summary.json").then(function(s){
    // 專案規則：只看自然流量。廣告觀看（ad_views_7d）不讀進來。
    var t = {generated: s.generated ? s.generated.replace(" ","T") : null, report_generated: s.generated, analytics_to: s.analytics_to,
             organic_views_7d: s.organic_views_7d, organic_minutes_7d: s.organic_minutes_7d, actions: s.actions || [],
             episodes: (s.episodes || []).map(function(e){return {ep: e.ep, title: e.title, style: e.style, org_views: e.org_views, first7: e.first7, ctr: e.ctr};}), prev: null};
    return listAll("yt-report").then(function(ents){
      var day = (s.generated || "").slice(0,10);
      var olds = ents.map(function(e){return e.path.split("/").pop();}).filter(function(n){return /^summary-\d{4}-\d\d-\d\d\.json$/.test(n) && n.slice(8,18) < day;}).sort();
      if(!olds.length) return t;
      return readJson("yt-report/"+olds[olds.length-1]).then(function(p){t.prev = {organic_views_7d: p.organic_views_7d, organic_minutes_7d: p.organic_minutes_7d}; return t;});
    }).catch(function(){return t;});
  });
}

// repo 狀態：GitHub Action 每次合併到 main、PR 開關、每 4 小時算好推到 dashboard-data 分支的 repo.json，
// 這裡經看的人的 GitHub 連接器讀（不花 Claude token）；讀不到就退回專案資料夾的 factory/repo.json。
var GH = {server: "github", owner: "clarencechien", repo: "DebugAfterDark", path: "repo.json", ref: "refs/heads/dashboard-data"};
var mcpNs;   // undefined：還沒問；null：這個畫面不能用連接器
function jsonFromToolResult(res){
  // 連接器回傳的樣子不固定：可能是 payload 物件、文字區塊、resource 區塊，或 GitHub REST 的 base64 content
  var cands = [];
  if(res && res.payload && typeof res.payload === "object") cands.push(res.payload);
  ((res && res.content) || []).forEach(function(b){
    if(b && typeof b.text === "string") cands.push(b.text);
    if(b && b.resource && typeof b.resource.text === "string") cands.push(b.resource.text);
  });
  if(res && typeof res.payload === "string") cands.push(res.payload);
  for(var i = 0; i < cands.length; i++){
    var c = cands[i], o = null;
    if(typeof c === "object"){
      if(c.episodes) return c;
      if(typeof c.content === "string" && c.encoding === "base64"){ try { o = JSON.parse(dec.decode(Uint8Array.from(atob(c.content.replace(/\s/g,"")), function(ch){ return ch.charCodeAt(0); }))); } catch(e) {} }
      else if(typeof c.text === "string"){ try { o = JSON.parse(c.text); } catch(e) {} }
    } else {
      var at = c.indexOf("{"); if(at >= 0){ try { o = JSON.parse(c.slice(at)); } catch(e) {} }
    }
    if(o && o.episodes) return o;
  }
  return null;
}
function loadRepo(){
  var ns = mcpNs === undefined ? window.claude.use("mcp").catch(function(){ return null; }) : Promise.resolve(mcpNs);
  var fallback = function(why){ return readJson("factory/repo.json").then(function(r){ r._via = "files"; r._why = why; return r; }); };
  return ns.then(function(m){
    mcpNs = m;
    if(!m) return fallback("unavailable");
    return m.callTool(GH.server, "get_file_contents", {owner: GH.owner, repo: GH.repo, path: GH.path, ref: GH.ref}, {cache: false}).then(function(res){
      var j = jsonFromToolResult(res);
      if(!j) return fallback("parse");
      j._via = "github"; return j;
    }, function(e){ console.warn("github connector", e); return fallback((e && e.code) || "error"); });
  });
}
// 還沒進 repo 的集數：集數 thread 在試聽前只把成品放在專案資料夾 episodes/epNN/（mp3＋epNN-review.md），
// 等 Clarence 試聽同意才開 PR。比 repo 最新一集還新的資料夾：有 mp3＝等試聽，沒有＝製作中。
function loadLocalEps(maxEp){
  return listAll("episodes").then(function(es){
    var dirs = es.filter(function(e){ var m = e.isDirectory && /(^|\/)ep(\d+)\/?$/.exec(e.path); return m && Number(m[2]) > maxEp; });
    return dirs.reduce(function(p, d){
      return p.then(function(out){
        var num = Number(/ep(\d+)\/?$/.exec(d.path)[1]), ep = "EP"+(num < 10 ? "0" : "")+num;
        return call(function(){ return files.list({path: d.path.replace(/\/$/,"")}); }).then(function(r){
          var fs = (r.entries || []).filter(function(f){ return !f.isDirectory; });
          // 試聽稿：有套版的 epNN-review.html（tools/review_html.py 產的，時間可以點）就開它，沒有才開 .md
          var mp3 = fs.filter(function(f){ return /\.mp3$/.test(f.path); })[0], rev = fs.filter(function(f){ return /-review\.md$/.test(f.path); })[0];
          var revHtml = fs.filter(function(f){ return /-review\.html$/.test(f.path); })[0];
          var item = {ep: ep, number: num, title: "", stage: mp3 ? "等試聽" : "製作中", audio: !!mp3, review: "⬜", local: true, reviewFile: revHtml ? revHtml.path : rev ? rev.path : null, mp3: mp3 ? mp3.path : null,
                      at: mp3 && mp3.createdAt ? mp3.createdAt : null};
          if(!rev) return out.concat([item]);
          return call(function(){ return files.read(rev.path, {length: 600}); }).then(function(x){
            var h = /^#\s+EP\d+\s+(.+?)(（[^）]*）)?\s*$/m.exec(dec.decode(x.bytes)); if(h) item.title = h[1];
            return out.concat([item]);
          }, function(){ return out.concat([item]); });
        }, function(){ return out; });
      });
    }, Promise.resolve([]));
  });
}
function soft(p){return p.catch(function(e){ console.warn(e); return null; });}

function load(){
  lastLoad = Date.now();
  var btn = document.getElementById("reload"); btn.disabled = true;
  var start = files ? Promise.resolve() : window.claude.use("files").then(function(f){
    if(!f) throw {code: "unavailable", message: "這個畫面讀不到專案檔案（要在 Claude 裡、用專案成員的帳號打開）。"};
    files = f; return findBase();
  });
  start.then(function(){
    return Promise.all([soft(loadRepo()), soft(loadResearch()), soft(loadShorts()), loadTraffic().catch(function(e){ return {error: (e && (e.code || e.message)) || String(e)}; })]);
  }).then(function(r){
    var maxEp = ((r[0] && r[0].episodes) || []).reduce(function(m, e){ var n = Number(String(e.ep).replace(/\D/g,"")); return n > m ? n : m; }, 0);
    if(!maxEp) return r;
    return soft(loadLocalEps(maxEp)).then(function(loc){ if(loc && loc.length){ r[0].episodes = r[0].episodes.concat(loc); r[0].next = (r[0].next||[]).filter(function(x){ return !loc.some(function(l){ return l.ep === x.ep; }); }); } return r; });
  }).then(function(r){
    render({repo: r[0], research: r[1], shorts: r[2], traffic: r[3]});
  }).catch(function(e){
    var msg = e && e.code === "not_granted" ? "你沒有允許這個頁面讀專案檔案。到頁面右上角的權限設定打開，再按重新整理。" : (e && e.message) || String(e);
    app.innerHTML = '<div class="err">讀不到資料：'+esc(msg)+'</div>';
    lastSig = null;
  }).then(function(){ btn.disabled = false; });
}
// ── 在頁面內打開研究稿：.md 轉成簡單的 HTML，報告 .html 放在沒有腳本權限的 iframe ──
function inline(t){
  return esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,function(_,a,u){return '<a href="'+u+'" target="_blank" rel="noopener">'+a+'</a>';})
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,"$1");
}
function mdToHtml(md){
  var out = [], lines = md.replace(/\r/g,"").split("\n"), i = 0, para = [];
  function flush(){ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para = []; } }
  while(i < lines.length){
    var l = lines[i], m;
    if(/^\s*$/.test(l)){ flush(); i++; continue; }
    if((m = l.match(/^(#{1,6})\s+(.*)/))){ flush(); var n = Math.min(m[1].length+1,4); out.push("<h"+n+">"+inline(m[2])+"</h"+n+">"); i++; continue; }
    if(/^\|/.test(l)){ flush(); var rows = []; while(i < lines.length && /^\|/.test(lines[i])){ var c = cells(lines[i]); if(!isSep(c)) rows.push(c); i++; }
      out.push('<table><thead><tr>'+rows[0].map(function(x){return "<th>"+inline(x)+"</th>";}).join("")+'</tr></thead><tbody>'+rows.slice(1).map(function(r){return "<tr>"+r.map(function(x){return "<td>"+inline(x)+"</td>";}).join("")+"</tr>";}).join("")+'</tbody></table>'); continue; }
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){ flush(); var ol = /^\s*\d+\./.test(l), items = []; while(i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])){ items.push("<li>"+inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/,""))+"</li>"); i++; }
      out.push((ol?"<ol>":"<ul>")+items.join("")+(ol?"</ol>":"</ul>")); continue; }
    if(/^>/.test(l)){ flush(); var q = []; while(i < lines.length && /^>/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,"")); i++; } out.push("<blockquote>"+inline(q.join(" "))+"</blockquote>"); continue; }
    if(/^```/.test(l)){ flush(); var code = []; i++; while(i < lines.length && !/^```/.test(lines[i])){ code.push(lines[i]); i++; } i++; out.push("<pre><code>"+esc(code.join("\n"))+"</code></pre>"); continue; }
    if(/^(-{3,}|\*{3,})$/.test(l.trim())){ flush(); out.push("<hr>"); i++; continue; }
    para.push(l.trim()); i++;
  }
  flush();
  return out.join("\n");
}
var viewer = document.getElementById("viewer"), vbody = document.getElementById("vbody"), vpath = null;
// 試聽稿的播放器：框裡的試聽稿讀不到專案檔案，mp3 由這裡讀進來播；稿子裡的時間被點時，框會送 review-seek 過來
var vaudio = document.getElementById("vaudio"), audioUrl = null, vframe = null;
function setAudio(mp3){
  if(audioUrl){ URL.revokeObjectURL(audioUrl); audioUrl = null; }
  vaudio.pause(); vaudio.removeAttribute("src"); vaudio.hidden = !mp3;
  if(!mp3) return;
  call(function(){ return files.read(mp3); }).then(function(r){
    if(vpath === null || vaudio.hidden) return;
    audioUrl = URL.createObjectURL(new Blob([r.bytes], {type: "audio/mpeg"})); vaudio.src = audioUrl;
  }).catch(function(e){ console.warn("mp3", e); vaudio.hidden = true; });
}
window.addEventListener("message", function(ev){
  var m = ev.data; if(!vframe || ev.source !== vframe.contentWindow || !m || m.type !== "review-seek" || !vaudio.src) return;
  var t = Number(m.t); if(!(t >= 0)) return;
  vaudio.currentTime = t; vaudio.play().catch(function(){});
});
function openDoc(p, title, mp3){
  vpath = p; document.getElementById("vtitle").textContent = title;
  vbody.className = "vb"; vbody.innerHTML = '<p class="muted">讀取中…</p>'; viewer.hidden = false; vframe = null;
  setAudio(mp3 || null);
  call(function(){return files.read(p);}).then(function(r){
    var text = dec.decode(r.bytes);
    if(/\.(html?|svg)$/.test(p)){
      vbody.className = "vb frame"; vbody.innerHTML = "";
      var f = vframe = document.createElement("iframe"); f.setAttribute("sandbox","allow-scripts"); /* 報告自己的圖表腳本可以跑，但拿不到這個頁面和專案檔案（沒有 allow-same-origin） */ f.setAttribute("title", title); f.srcdoc = /\.svg$/.test(p) ? '<!doctype html><meta name="viewport" content="width=device-width"><style>html,body{margin:0;background:#fff}svg{display:block;width:max(100%,900px);height:auto}</style>'+text : text; vbody.appendChild(f);
    } else vbody.innerHTML = '<div class="md">'+mdToHtml(text)+'</div>';
    vbody.scrollTop = 0;
  }).catch(function(e){ vbody.innerHTML = '<div class="err">打不開：'+esc((e && (e.code||e.message)) || e)+'</div>'; });
}
app.addEventListener("click",function(ev){ var j = ev.target.closest && ev.target.closest("[data-step]"); if(j){ ev.preventDefault(); var dd = document.getElementById(j.getAttribute("data-step")); if(dd){ dd.open = true; dd.scrollIntoView({behavior:"smooth", block:"start"}); } return; } var b = ev.target.closest && ev.target.closest("button.open"); if(b) openDoc(b.getAttribute("data-path"), b.getAttribute("data-title"), b.getAttribute("data-mp3")); });
document.getElementById("vclose").addEventListener("click",function(){ viewer.hidden = true; vbody.innerHTML = ""; vframe = null; vpath = null; setAudio(null); });
document.getElementById("vdl").addEventListener("click",function(){ if(vpath && files) files.download(vpath).catch(function(){}); });
document.addEventListener("keydown",function(e){ if(e.key === "Escape" && !viewer.hidden) document.getElementById("vclose").click(); });
document.getElementById("reload").addEventListener("click",function(){ lastSig = null; load(); });  /* 按鈕一定重畫（狀態照樣保留） */
// 切回這個分頁時更新，但打開稿件時不動、上次更新不到 1 分鐘也不動
document.addEventListener("visibilitychange",function(){if(document.visibilityState === "visible" && files && viewer.hidden && Date.now() - lastLoad > 60000) load();});
if(window.claude && window.claude.use){ showCached(); load(); }
else app.innerHTML = '<div class="err">這個頁面要在 Claude 裡打開，才讀得到專案資料夾。</div>';
})();

</script>
